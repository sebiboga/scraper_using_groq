name: epam demo
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Select the model to use'
        required: true
        type: choice
        options:
          - whisper-large-v3-turbo
          - whisper-large-v3
          - openai/gpt-oss-20b
          - openai/gpt-oss-120b
          - meta-llama/llama-guard-4-12b
          - llama-3.3-70b-versatile
          - llama-3.1-8b-instant
          - compound-beta
          - compound-beta-mini
        default: compound-beta
      url:
        description: 'Enter the URL to analyze as a job description page'
        required: true
        type: string
        default: 'https://marquardt-group.csod.com/ux/ats/careersite/5/home/requisition/4552?c=marquardt-group'
jobs:
  run-curl:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run cURL command and extract JSON
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          response=$(curl https://api.groq.com/openai/v1/chat/completions -s \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -d '{
              "model": "${{ inputs.model }}",
              "messages": [
                {
                  "role": "system",
                  "content": "act like sherlock and investigate. given the potential job description links you receive by user, decide if the page is a job description page. the output we expect as a JSON object.. just the JSON, no observations, no explanation. print it as a code so I can easily copy and paste. The JSON must contain: url, job_description"
                },
                {
                  "role": "user",
                  "content": "${{ inputs.url }}"
                }
              ]
            }')

          echo "$response" | jq -r '.choices[0].message.content'
